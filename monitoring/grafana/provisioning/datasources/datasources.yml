apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom-telemetry
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: PostgreSQL Telemetry
    uid: pg-telemetry
    type: postgres
    access: proxy
    url: postgres:5432
    user: mlops
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: machine_logs
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: true
