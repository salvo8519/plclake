# Standalone Mailpit SMTP Testing Server (Zero-Auth Local Inbox)
# Start:  docker compose -f docker-compose.mailpit.yml up -d
# SMTP:   127.0.0.1:1025 (no auth, STARTTLS optional)
# Web UI: http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: telemetry-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
