# PLCLake — Staging Environment Overrides
# Usage:
#   helm upgrade --install plclake ./deploy/helm/plclake \
#     -n plclake-staging --create-namespace \
#     -f ./deploy/helm/plclake/values-staging.yaml \
#     --set image.tag="1.0.0-<git-sha>"

replicaCount: 1

image:
  pullPolicy: Always

env:
  PLANT_SITE_ID: plant-staging
  LOG_LEVEL: debug
  API_ENFORCE_AUTH: "true"
  DATABASE_SSL: "true"
  DATABASE_POOL_MAX: "10"

existingSecret: "plclake-staging-secrets"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: staging.plclake.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: plclake-staging-tls
      hosts:
        - staging.plclake.example.com

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 2Gi

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
