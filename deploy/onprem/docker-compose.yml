# PLCLake — Customer On-Premise & Air-Gapped Production Stack
# Runs pre-built immutable image (never compiles on the plant server).
#
# Quick start:
#   cp .env.onprem.example .env
#   # Edit .env with strong secrets & plant domain/IP
#   docker compose up -d
#
# Optional bundled Prometheus + Grafana observability profile:
#   docker compose --profile observability up -d

services:
  proxy:
    image: caddy:2.8-alpine
    container_name: plclake-proxy
    restart: unless-stopped
    depends_on:
      plclake:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PLCLAKE_SITE_ADDRESS: ${PLCLAKE_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - plclake_caddy_data:/data
      - plclake_caddy_config:/config
    networks:
      - plclake_net

  plclake:
    image: ${PLCLAKE_IMAGE:-ghcr.io/salvo8519/plclake:1.0.0}
    container_name: plclake-app
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - plclake_state:/app/.state
    environment:
      NODE_ENV: production
      PORT: "3000"
      PLANT_SITE_ID: ${PLANT_SITE_ID:-plant-01}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-plclake}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@pgbouncer:6432/${POSTGRES_DB:-plclake_telemetry}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      API_ENFORCE_AUTH: ${API_ENFORCE_AUTH:-true}
      # Caddy is the only client of the app (port not published): trust exactly one proxy hop
      # so rate limits and audit entries see real client IPs.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Set 64-hex SECRETS_ENCRYPTION_KEY in .env}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@plant.local}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Set AUTH_ADMIN_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@plant.local}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-maintenance@plant.local}
      SCALAR_CDN_URL: ${SCALAR_CDN_URL:-}
      METRICS_AUTH_REQUIRED: ${METRICS_AUTH_REQUIRED:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${PLCLAKE_MEM_LIMIT:-1024M}
    networks:
      - plclake_net

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    container_name: plclake-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-plclake}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-plclake_telemetry}
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-400}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-25}
      RESERVE_POOL_SIZE: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-plclake}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - plclake_net

  postgres:
    image: postgres:16-alpine
    container_name: plclake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plclake_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-plclake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "wal_compression=on"
    volumes:
      - plclake_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plclake} -d ${POSTGRES_DB:-plclake_telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - plclake_net

  pg-backup:
    image: postgres:16-alpine
    container_name: plclake-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-plclake}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-plclake_telemetry}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /backups
        while true; do
          TS=$$(date -u +"%Y%m%dT%H%M%SZ")
          pg_dump --format=custom --compress=9 --file="/backups/plclake_$${TS}.dump"
          find /backups -type f -name "plclake_*.dump" -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SEC}"
        done
    volumes:
      - plclake_backups:/backups
    networks:
      - plclake_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: plclake-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - plclake
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - plclake_promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - plclake_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: plclake-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD when using observability profile}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DEFAULT_THEME: light
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - plclake_grafanadata:/var/lib/grafana
    networks:
      - plclake_net

volumes:
  plclake_state:
  plclake_pgdata:
  plclake_backups:
  plclake_caddy_data:
  plclake_caddy_config:
  plclake_promdata:
  plclake_grafanadata:

networks:
  plclake_net:
    driver: bridge
