name: Release — Immutable Docker Image, Staging & Production Promotion

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "README.it.md"
      - "docs/**"
      - "*.md"
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment for manual promotion"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Immutable Image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      immutable_tag: ${{ steps.meta.outputs.immutable_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read centralized version from config/app.json
        id: meta
        run: |
          APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('config/app.json','utf8')).version")
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/${OWNER_LOWER}/plclake"
          IMMUTABLE_TAG="${APP_VERSION}-${SHORT_SHA}"
          TAGS="${IMAGE_REPO}:${IMMUTABLE_TAG}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE_REPO}:staging"
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*)
              TAGS="${TAGS},${IMAGE_REPO}:${APP_VERSION},${IMAGE_REPO}:latest"
              ;;
          esac
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${IMMUTABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push multi-stage PLCLake image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_BUILD_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging & Verify /api/v1/version
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Staging via Helm (when KUBECONFIG_STAGING is configured)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_STAGING }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          IMMUTABLE_TAG: ${{ needs.build-and-push.outputs.immutable_tag }}
        run: |
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "Image published: ${IMAGE_REF}:${IMMUTABLE_TAG}"
            echo "Add KUBECONFIG_STAGING secret and STAGING_BASE_URL variable in GitHub Environment 'staging' to activate auto-deploy."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          helm upgrade --install plclake ./deploy/helm/plclake \
            -n plclake-staging --create-namespace \
            -f ./deploy/helm/plclake/values-staging.yaml \
            --set image.repository="${IMAGE_REF}" \
            --set image.tag="${IMMUTABLE_TAG}" \
            --wait --timeout 3m

      - name: Post-deploy Staging smoke test (/readyz & /api/v1/version)
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          EXPECTED_VERSION: ${{ needs.build-and-push.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${STAGING_BASE_URL:-}" ]; then
            echo "STAGING_BASE_URL not configured — skipping smoke test."
            exit 0
          fi
          curl -fsS "${STAGING_BASE_URL}/readyz"
          VER_JSON=$(curl -fsS "${STAGING_BASE_URL}/api/v1/version")
          echo "Staging version payload: ${VER_JSON}"
          echo "${VER_JSON}" | grep -q "\"version\":\"${EXPECTED_VERSION}\""
          echo "${VER_JSON}" | grep -q "\"buildSha\":\"${EXPECTED_SHA}\""

  deploy-production:
    name: Promote Immutable Image to Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Production via Helm (when KUBECONFIG_PROD is configured)
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          IMMUTABLE_TAG: ${{ needs.build-and-push.outputs.immutable_tag }}
          APP_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "Production release image published: ${IMAGE_REF}:${APP_VERSION}"
            echo "Add KUBECONFIG_PROD secret and PROD_BASE_URL variable in GitHub Environment 'production' to activate auto-promotion."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          helm upgrade --install plclake ./deploy/helm/plclake \
            -n plclake-prod --create-namespace \
            -f ./deploy/helm/plclake/values-prod.yaml \
            --set image.repository="${IMAGE_REF}" \
            --set image.tag="${IMMUTABLE_TAG}" \
            --wait --timeout 4m

      - name: Post-deploy Production smoke test (/readyz & /api/v1/version)
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          EXPECTED_VERSION: ${{ needs.build-and-push.outputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "${PROD_BASE_URL:-}" ]; then
            echo "PROD_BASE_URL not configured — skipping smoke test."
            exit 0
          fi
          curl -fsS "${PROD_BASE_URL}/readyz"
          VER_JSON=$(curl -fsS "${PROD_BASE_URL}/api/v1/version")
          echo "Production version payload: ${VER_JSON}"
          echo "${VER_JSON}" | grep -q "\"version\":\"${EXPECTED_VERSION}\""
          echo "${VER_JSON}" | grep -q "\"buildSha\":\"${EXPECTED_SHA}\""
